name: Experiment checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  models-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build and check generated pages
        run: |
          python3 build.py
          git diff --exit-code -- docs src/phantom/index.html src/flower-evidence/index.html src/route-learning/index.html src/same-coin/index.html src/kelvin-wakes/index.html src/mirror-window/index.html src/noise-threshold/index.html src/smoke-seeds/index.html src/knot-colorings/index.html src/talbot-revivals/index.html src/diffusion-growth/index.html
      - name: Model, sequence, and audio lifecycle checks
        run: |
          node tests/test_clocks.js
          node tests/test_sequence.js "$RUNNER_TEMP/erebos-midi-check"
          node tests/test_synth.js
          python3 tests/parse_midi.py "$RUNNER_TEMP/erebos-midi-check"
          python3 tests/verify_traffic.py "$RUNNER_TEMP/erebos-traffic-check"
          python3 tests/check_package.py
          python3 src/riffle/test_model.py -v
          python3 tests/verify_riffle.py
          python3 -B src/phantom/scripts/verify.py
      - name: Addition module checks
        run: |
          python3 -B src/flower-evidence/test_demo.py
          node src/route-learning/verify.js
          python3 -B src/route-learning/verify_equilibrium.py
          node src/route-learning/test_review.js
          python3 -B src/route-learning/test_validation.py
          python3 -B src/square-ice/checks.py
          python3 -B src/square-ice/verify_loops.py
          python3 -B src/square-ice/boundary_paths.py
          python3 -B src/square-ice/test_soft_bound.py
          python3 -B src/square-ice/test_review.py
          python3 -B src/square-ice/generate_fixtures.py --check
          python3 -B tests/check_additions.py
          python3 -B tests/verify_spinning_disk.py
          node tests/verify_spinning_disk.js
          python3 -B src/same-coin/verify.py
          node src/kelvin-wakes/verify.mjs
          node src/oscillator-bench/test-model.cjs
          python3 -B src/restart-bargain/verify.py
          python3 -B src/mirror-window/verify.py
          python3 -B src/noise-threshold/verify.py
          python3 -B src/smoke-seeds/verify.py

      - name: Knot, Talbot and diffusion checks
        run: |
          python3 -B -m unittest discover -s src/knot-colorings -p 'test_*.py' -v
          python3 -B src/knot-colorings/verify_certificates.py
          node src/knot-colorings/test_engine.js
          python3 -B src/talbot-revivals/study.py
          python3 -B src/talbot-revivals/scaling.py
          python3 -B src/talbot-revivals/verify.py
          node src/talbot-revivals/verify.js
          node src/talbot-revivals/ui_smoke.js
          python3 -B src/talbot-revivals/coherence.py
          python3 -B src/talbot-revivals/verify_coherence.py
          python3 -B src/talbot-revivals/finite_array.py
          python3 -B src/talbot-revivals/verify_finite_array.py
          node src/diffusion-growth/test_model.js
          node src/diffusion-growth/reference_growth.js
          node src/diffusion-growth/test_solver.js
          node src/diffusion-growth/test_ui.js
          node src/diffusion-growth/verify_access.js
          python3 -B src/diffusion-growth/verify_fixtures.py
